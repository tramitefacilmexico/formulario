<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trámite Fácil México</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#103050; --steel:#5080a0; --green:#80c040; --bg:#f2f5f9; --line:#d5dde6; --err:#b3261e; }
  * { box-sizing:border-box; }
  html { -webkit-tap-highlight-color:transparent; }
  button, label, select, input { touch-action:manipulation; }
  body { margin:0; background:var(--bg); color:var(--navy); font-family:Roboto,Arial,sans-serif; font-size:16px; line-height:1.45; }
  header { background:var(--navy); color:#fff; padding:22px 16px 18px; border-bottom:4px solid var(--green); }
  header .in, main, .bar .in { max-width:760px; margin:0 auto; }
  header .head { display:flex; align-items:center; gap:14px; }
  header .logo { flex:none; width:88px; height:auto; filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px rgba(255,255,255,.7)); }
  header .txt { min-width:0; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:#cfe0ee; font-size:15px; }
  .chip { display:inline-block; background:var(--green); color:var(--navy); font-weight:700; font-size:13px; padding:2px 10px; border-radius:99px; margin-top:10px; }
  main { padding:16px 16px 120px; }
  .intro { background:#fff; border-left:4px solid var(--steel); border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:15px; }
  .card { background:#fff; border-radius:12px; padding:18px 16px 6px; margin-bottom:16px; box-shadow:0 1px 6px rgba(16,48,80,.08); }
  .card h2 { margin:0 0 4px; font-size:18px; padding-bottom:8px; border-bottom:2px solid var(--green); }
  .card .ayuda { color:var(--steel); font-size:14px; margin:8px 0 0; }
  .f { margin:14px 0; }
  .f[hidden], .card[hidden], .exp[hidden] { display:none; }
  label.l { display:block; font-weight:500; margin-bottom:4px; }
  .req { color:var(--err); }
  .help { color:var(--steel); font-size:13px; margin:2px 0 4px; }
  .tipbtn { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-left:6px; padding:0; vertical-align:middle; border:1.5px solid var(--steel); border-radius:50%; background:#fff; color:var(--steel); font:700 13px/1 Roboto,Arial,sans-serif; cursor:pointer; }
  .tipbtn[aria-expanded=true] { background:var(--steel); color:#fff; }
  .tip { background:#eef4f9; border-left:4px solid var(--green); border-radius:6px; padding:9px 12px; margin:4px 0 8px; font-size:14px; color:var(--navy); }
  .tip[hidden] { display:none; }
  .tip a { color:var(--steel); font-weight:500; }
  .ptitulo { margin:18px 0 6px; }
  .ptitulo.linea { margin-top:26px; padding-top:18px; border-top:2px solid var(--line); }
  .ptitulo h3 { margin:0; font-size:16px; color:var(--navy); }
  .tip img { display:block; max-width:100%; height:auto; margin:8px 0 4px; border:1px solid var(--line); border-radius:6px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
    width:100%; font:inherit; font-size:16px; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  textarea { min-height:84px; resize:vertical; }
  .fecha { display:grid; grid-template-columns:0.8fr 1.4fr 1fr; gap:8px; }
  .fecha select { padding:10px 6px; }
  .dur { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--steel); border-color:var(--steel); }
  .yn { display:flex; gap:10px; }
  .yn label { position:relative; flex:1; text-align:center; border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; background:#fff; }
  .yn input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
  .yn label.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .exp { margin-top:8px; }
  .est { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 14px 10px; margin:0 0 16px; }
  .est-t { font-weight:700; font-size:16px; margin-bottom:10px; }
  .est-l { list-style:none; margin:0; padding:0; }
  .est-l li { position:relative; padding:0 0 16px 40px; min-height:30px; }
  .est-l li:last-child { padding-bottom:4px; }
  .est-l li:before { content:""; position:absolute; left:12px; top:26px; bottom:-2px; width:2px; background:var(--line); }
  .est-l li:last-child:before { display:none; }
  .est-l li.hecho:before { background:var(--green); }
  .est-p { position:absolute; left:0; top:0; width:26px; height:26px; border-radius:50%; background:#eef2f7; color:#8aa0b6; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .est-l li.hecho .est-p { background:var(--green); color:var(--navy); }
  .est-l li.ahora .est-p { background:var(--navy); color:#fff; box-shadow:0 0 0 4px rgba(16,48,80,.15); }
  .est-n { font-weight:700; line-height:26px; }
  .est-l li.pend .est-n { color:#8aa0b6; font-weight:600; }
  .est-aqui { display:inline-block; background:#E7DCC4; color:#4A3A28; border:1px solid #C2B08A; border-radius:99px; font-size:11px; font-weight:700; padding:0 8px; margin-left:8px; vertical-align:middle; }
  .est-a { background:#f2f5f9; border-radius:8px; padding:8px 10px; margin-top:6px; font-size:14px; font-weight:500; }
  .est-pend { background:#fdeec2; border-radius:8px; padding:8px 10px; margin-top:6px; font-size:14px; font-weight:500; color:#6b4a00; }
  .est-fin { text-align:center; font-weight:700; padding:4px 0 6px; }
  .est-u { color:var(--steel); font-size:12px; margin-top:6px; }
  .okdoc { color:#2f7a1f; font-weight:500; font-size:13px; }
  .faltadoc { color:var(--err); font-weight:500; font-size:13px; }
  .redrow { display:grid; gap:8px; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#f8fbfd; }
  .redrow [hidden] { display:none; }
  .redes .mas { background:#fff; color:var(--navy); border:1px solid var(--steel); border-radius:8px; padding:9px 14px; font:inherit; font-size:15px; cursor:pointer; }
  .redes .quita { justify-self:end; border:0; background:none; color:var(--err); font:inherit; font-size:14px; cursor:pointer; padding:2px 0; }
  .f.bad input[type=text], .f.bad input[type=email], .f.bad input[type=tel], .f.bad input[type=date], .f.bad select, .f.bad textarea, .f.bad .yn label { border-color:var(--err); }
  .f.bad .pick { border-color:var(--err); }
  .msg { color:var(--err); font-size:13px; margin-top:4px; display:none; }
  .f.bad .msg { display:block; }
  .file { border:2px dashed var(--steel); border-radius:10px; padding:12px; background:#f8fbfd; }
  .file button.add { background:#fff; color:var(--navy); border:1px solid var(--steel); border-radius:8px; padding:9px 14px; font:inherit; font-size:15px; cursor:pointer; }
  .file input[type=file] { display:none; }
  .fl { list-style:none; margin:8px 0 0; padding:0; }
  .fl li { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; padding:4px 0; word-break:break-all; }
  .fl button { border:0; background:none; color:var(--err); font-size:18px; cursor:pointer; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px; box-shadow:0 -2px 10px rgba(16,48,80,.08); }
  .bar .in { display:flex; align-items:center; gap:14px; }
  .prog { flex:1; }
  .prog .t { font-size:13px; color:var(--steel); }
  .prog .b { height:8px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:3px; }
  .prog .b i { display:block; height:100%; width:0; background:var(--green); transition:width .2s; }
  button.send { background:var(--green); color:var(--navy); border:0; border-radius:10px; font:inherit; font-weight:700; padding:12px 22px; cursor:pointer; }
  button.send:disabled { opacity:.6; cursor:default; }
  .over { position:fixed; inset:0; background:rgba(16,48,80,.6); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .over.on { display:flex; }
  .box { position:relative; background:#fff; border-radius:14px; padding:24px; max-width:460px; width:100%; max-height:90vh; overflow-y:auto; border-top:5px solid var(--green); }
  .box h2 { margin:0 0 8px; }
  .box ul { padding-left:20px; }
  .box button { margin-top:8px; }
  .box .xcierra { position:absolute; top:8px; right:10px; width:36px; height:36px; margin:0; padding:0; font-size:26px; line-height:1; background:transparent; color:var(--navy); border:0; border-radius:50%; cursor:pointer; }
  .box .xcierra:hover { background:#eef2f7; }
  .fin .cerrar { background:transparent; border:0; color:var(--navy); text-decoration:underline; font-size:15px; padding:10px; }
  .fin button { display:block; width:100%; font-size:17px; padding:16px 20px; margin:10px 0 0; }
  .ghost { background:#fff; color:var(--navy); border:1px solid var(--steel); border-radius:10px; font:inherit; padding:11px 18px; cursor:pointer; }
  .quien { margin:8px 0 0 !important; color:#fff !important; font-weight:700; font-size:18px !important; letter-spacing:.2px; }
  .quien[hidden] { display:none; }
  .volver { display:block; margin:0 0 12px; padding:11px 14px; background:#fff; border:1px solid var(--steel); border-radius:10px; color:var(--navy); font-weight:500; font-size:15px; text-decoration:none; }
  .persona { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:12px; border:1px solid var(--line); border-radius:10px; margin:10px 0; background:#fff; }
  .persona b { display:block; word-break:break-word; }
  .persona .est { font-size:13px; color:var(--steel); }
  .persona a { text-decoration:none; }
  .ok .est { color:#2f7a1f; }
  .nom { margin:8px 0; }
  .num { color:var(--steel); font-weight:700; margin-right:6px; white-space:nowrap; }
  .pick { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:10px; margin:10px 0; cursor:pointer; background:#fff; }
  .pick input { width:22px; height:22px; flex:none; margin:0; }
  .pick.on { border-color:var(--navy); background:#f2f5f9; }
  .pb { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:12px 0 4px; }
  .pb i { display:block; height:100%; width:0; background:var(--green); transition:width .2s; }
</style>
</head>

  function pideMotivos(faltan, sa) {
    // motivos escritos antes (si ya había intentado enviar): líneas "Documento: motivo"

    });
    var kids = [
      h('h2', { text: 'Faltan documentos' }),

    enviarAsi.addEventListener('click', function () {

      });
      if (mal) return;
      if (sa) sa.input.value = cajas.map(function (c) { return c.f.label + ': ' + c.ta.value.trim().replace(/\s*\n+\s*/g, ' '); }).join('\n');
      envioFinal();
    });
    kids.push(h('div', {}, [enviarAsi, DOM.createTextNode(' '), volver]));

  function envioFinal() {
    var st = state();
    var payload = {};
    DATA.sections.forEach(function (s) {
      s.fields.forEach(function (f) {
        if (!st.vis[f.id] || f.type === 'file' || f.type === 'aviso' || f.type === 'titulo') return;
        payload[f.id] = String(st.a[f.id] || '').trim();
        if (f.type === 'yesno' && payload[f.id] === 'Sí' && st.a[f.id + '_exp']) payload[f.id + '_exp'] = String(st.a[f.id + '_exp']).trim();
      });
    });
    var envios = [];
    Object.keys(refs).forEach(function (id) {
      var r = refs[id];
      if (r.def.type === 'file' && st.vis[id]) r.files.forEach(function (file) { envios.push({ id: id, label: r.def.label, file: file }); });
    });

    var barra = h('i'), txt = h('p', { text: 'Enviando tu información…' });
    overlay(h('div', {}, [h('h2', { text: 'Enviando' }), txt, h('div', { class: 'pb' }, [barra]), h('p', { class: 'help', text: 'No cierres esta ventana.' })]));
    var total = envios.length + 2, hechos = 0;
    function avance(m) { hechos++; barra.style.width = Math.round(hechos * 100 / total) + '%'; if (m) txt.textContent = m; }

    var etapa = 'iniciar';
    run('iniciar', DATA.token, payload).then(function () {
      etapa = 'subir';
      avance('Subiendo documentos…');
      var n = 0;
      return subeTodo(envios, function () { n++; txt.textContent = 'Subiendo documentos (' + n + ' de ' + envios.length + ')…'; avance(); });
    }).then(function () { etapa = 'finalizar'; return run('finalizar', DATA.token); })
      .then(function (r) {
        avance(); listo(r.faltan || []);
        run('pdfFicha', DATA.token).catch(function () {});   // el PDF se hace aparte, sin hacer esperar al cliente
      })
      .catch(function (e) {
        if (etapa === 'finalizar') { confirmaEnvio(e); return; }   // lo importante ya llegó: solo falta confirmar
        var b = h('button', { class: 'send', type: 'button', text: 'Volver al formulario' }); b.addEventListener('click', cierra);
        overlay(h('div', {}, [h('h2', { text: 'No se pudo enviar' }), h('p', { text: String(e.message || e) }), h('p', { class: 'help', text: 'Tus respuestas siguen aquí. Puedes intentar de nuevo.' }), b]));
      });
  }

  // El último paso falló (p. ej. servidor ocupado) pero la información y los documentos ya llegaron: se repite solo ese paso
  function confirmaEnvio(e) {
    var b = h('button', { class: 'send', type: 'button', text: 'Confirmar envío' });
    overlay(h('div', {}, [h('h2', { text: 'Casi listo' }),

      h('p', { class: 'help', text: String((e && e.message) || e) }), b]));
    b.addEventListener('click', function () {
      b.disabled = true; b.textContent = 'Confirmando…';
      run('finalizar', DATA.token).then(function (r) {
        listo(r.faltan || []);

      }).catch(function (e2) { confirmaEnvio(e2); });

  // Sube los archivos de a 3 a la vez para tardar menos; los archivos de un mismo documento (p. ej. varias hojas del pasaporte)
  // van uno tras otro, para que sus nombres (Pasaporte, Pasaporte (2)…) no se encimen.
  function subeTodo(envios, alTerminarUno) {
    var grupos = {};
    envios.forEach(function (e) { (grupos[e.id] = grupos[e.id] || []).push(e); });
    var colas = Object.keys(grupos).map(function (k) { return grupos[k]; });
    return new Promise(function (ok, ko) {
      var siguiente = 0, activos = 0, fallo = false;
      function lanza() {
        if (fallo) return;
        if (!colas.length || (siguiente >= colas.length && activos === 0)) { ok(); return; }
        while (!fallo && activos < 3 && siguiente < colas.length) {
          activos++;
          colas[siguiente++].reduce(function (p, e) {
            return p.then(function () {
              if (yaSubidos.indexOf(e.file) >= 0) { if (alTerminarUno) alTerminarUno(); return; }   // ya llegó en un intento anterior: no se duplica
              return prepara(e.file).then(function (pf) { return aBase64(pf.blob).then(function (b64) {
                return run('subir', DATA.token, e.id, e.label, pf.name, pf.mime, b64).catch(function () {
                  return run('subir', DATA.token, e.id, e.label, pf.name, pf.mime, b64); // un reintento
                });
              }); }).then(function () { yaSubidos.push(e.file); if (alTerminarUno) alTerminarUno(); });
            });
          }, Promise.resolve()).then(function () { activos--; lanza(); }, function (err) { fallo = true; ko(err); });
        }
      }
      lanza();
    });
  }

  // Estado del trámite (solo China integral): 5 etapas, «Estás aquí» y lo que pasa ahora
  function estatusEl(e) {

    card2.appendChild(h('h2', { text: 'Agregar otra persona' }));
    card2.appendChild(h('p', { class: 'ayuda', text: 'Escribe su nombre completo, como aparece en el pasaporte. Tendrá su propio formulario.' }));
    var cont = h('div', {}), ni = cajasNombres(cont);
    card2.appendChild(cont);
    var msg = h('div', { class: 'msg' });
    var mas = h('button', { class: 'ghost', type: 'button', text: '+ Otra más' });
    mas.addEventListener('click', function () { ni.agrega().focus(); });
    var go = h('button', { class: 'send', type: 'button', text: 'Agregar' });
    go.addEventListener('click', function () {
      var nombres = ni.valores();
      if (!nombres.length || nombres.some(function (x) { return x.length < 3; })) { msg.textContent = 'Escribe el nombre completo'; msg.style.display = 'block'; return; }
      msg.style.display = 'none'; go.disabled = true; go.textContent = 'Agregando…';
      run('crearPersonas', QS.get('o'), QS.get('k'), QS.get('f'), nombres).then(function () { location.href = pedidoUrl('&g=1'); })
        .catch(function (e) { go.disabled = false; go.textContent = 'Agregar'; msg.textContent = e.message; msg.style.display = 'block'; });
    });
    card2.appendChild(h('div', { class: 'f' }, [msg, mas, DOM.createTextNode(' '), go]));
    $('#app').appendChild(card); $('#app').appendChild(card2);
  }

  if (DATA.paso === 'nombres') { pasoNombres(); return; }
  if (DATA.paso === 'grupo') { pasoGrupo(); return; }
  pintaQuien(DATA.solicitante);
  if (esPedido) {   // enlace para volver a la lista de personas del pedido (o agregar más)
    $('main').insertBefore(h('a', { class: 'volver', href: pedidoUrl('&g=1'), text: textoGrupo() }), DOM.querySelector('.intro'));
  }

  if (DATA.ya && !(new URLSearchParams(location.search)).get('completo')) {
    construyeMas();
    if (location.hash === '#corregir') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} construyeCorregir(); }
    return;
  }

  build(); restaura();
  if (refs.nombre && refs.nombre.input && !refs.apellidos && !refs.nombre.input.value && DATA.solicitante) refs.nombre.input.value = DATA.solicitante;   // el nombre que ya se capturó al crear el link
  var btnAtras = h('button', { class: 'ghost', type: 'button', id: 'atras', text: '← Atrás' });
  $('.bar .in').insertBefore(btnAtras, $('#send'));
  btnAtras.addEventListener('click', function () { if (cur > 0) { cur--; sync(); window.scrollTo(0, 0); enviaBorrador(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') enviaBorrador(true); });
  sync();
  // por pasos: "Siguiente" revisa solo la sección de este paso; en el último paso es "Enviar" y revisa todo
  function avanza() {
    if (modoCorregir || visSecs.length < 2 || cur >= visSecs.length - 1) { enviar(); return; }
    var sid = visSecs[cur];
    var errs = validar(state()).filter(function (e) { return secDe[e.id] === sid; });
    pintaErrores(errs);
    if (errs.length) { refs[errs[0].id].wrap.scrollIntoView({ block: 'center' }); return; }
    cur++; sync(); window.scrollTo(0, 0); enviaBorrador();
  }
  $('#send').addEventListener('click', avanza);
  $('#app').addEventListener('input', sync);
  $('#app').addEventListener('change', sync);
}
</script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var tok = qs.get('t') || '';
  // Link por pedido (lo manda Odoo): ?o=S02667&k=clave&f=USA-Nuevo&n=1; el servidor crea o encuentra el registro
  var porPedido = !tok && qs.get('o') && qs.get('k');
  var consulta = porPedido
    ? 'v=2&o=' + encodeURIComponent(qs.get('o')) + '&k=' + encodeURIComponent(qs.get('k')) + '&f=' + encodeURIComponent(qs.get('f') || '') + (qs.get('p') ? '&p=' + encodeURIComponent(qs.get('p')) : '') + (qs.get('g') ? '&g=1' : '')
    : 't=' + encodeURIComponent(tok);
  var box = document.getElementById('cargando');
  function msg(t) { box.textContent = t; }
  if (!tok && !porPedido) { msg('Este link no es válido. Pide uno nuevo por WhatsApp.'); return; }
  // Pide las preguntas al servidor; a veces Google tarda o no responde, así que si pasan 8 s
  // reintenta (hasta 5 veces) y si no, avisa.
  function carga(intento) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(API + '?api=1&' + consulta, ctl ? { signal: ctl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer);
        if (!j.ok) { msg(j.error || 'Este link no es válido. Pide uno nuevo por WhatsApp.'); return; }
        DATA = j.data; box.hidden = true;
        // el link por pedido se queda en la barra: sirve para volver a la lista de personas del pedido
        arranca();
      })
      .catch(function () {
        clearTimeout(timer);
        if (intento < 5) { msg('Cargando formulario… (intento ' + (intento + 1) + ' de 5)'); carga(intento + 1); return; }
        box.textContent = 'No se pudo cargar el formulario. Revisa tu internet y ';
        var a = document.createElement('a'); a.href = location.href; a.textContent = 'toca aquí para reintentar'; box.appendChild(a); box.appendChild(document.createTextNode('.'));
      });
  }
  carga(1);
})();
</script>
